<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINX Sign Up</title>
    <link type="text/css" rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="cinx-signup-container">
        <div class="cinx-logo">
            <h1>CINX</h1>
        </div>
        <div class="cinx-form-wrapper">
            <h2>Sign Up</h2>
            <p>Welcome to CINX! Please create an account to book your favorite movies and snacks.</p>
            <form id="signup-form">
                <div class="input-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" placeholder="Enter your first name" required>
                </div>
                <div class="input-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" placeholder="Enter your last name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="input-group">
                    <button type="submit" class="submit-btn">Sign Up</button>
                </div>
            </form>
            <p class="already-member">Already a member? <a href="login.html">Log In</a></p>
        </div>
    </div>
    <script>
        // Handle form submission
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            
            // Retrieve form data
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const email = document.getElementById('email').value;
            
            // Save user data to localStorage
            localStorage.setItem('firstName', firstName);
            localStorage.setItem('lastName', lastName);
            localStorage.setItem('email', email);

            // Redirect to the Welcome Page
            window.location.href = "welcome.html";
        });
    </script>
</body>
</html>
